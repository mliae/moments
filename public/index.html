  <script>
    // 主题恢复（避免闪烁）：light / dark，默认跟随系统
    (function () {
      var t = localStorage.getItem("moments_theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <script>
    // 旧版 hash 路由（#/post/xxx、#/photos…）301 式跳转到真实路径，保证外链/收藏可用
    (function () {
      var h = location.hash || "";
      if (h.indexOf("#/") !== 0) return;
      var rest = h.slice(2);
      var map = { "": "/", posts: "/posts", photos: "/photos", admin: "/admin" };
      var path = null;
      if (map.hasOwnProperty(rest.split("?")[0])) {
        path = map[rest.split("?")[0]];
        var qIdx = rest.indexOf("?");
        if (qIdx >= 0 && path === "/") path = "/";
        if (qIdx >= 0 && rest.slice(0, qIdx) !== "") path += (path.indexOf("?") >= 0 ? "&" : "?") + rest.slice(qIdx + 1);
      } else if (rest.indexOf("post/") === 0) {
        path = "/" + rest;
      }
      if (path) history.replaceState(null, "", path);
    })();
  </script>

  <script>
    // 首帧顶栏修正：用上次缓存的设置立即替换默认品牌名/头像/导航文字，
    // 消除「打开瞬间显示默认值，设置加载后才变成实际值」的闪现
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("moments_settings") || "null");
        if (!s || typeof s !== "object") return;
        // 旧 workers.dev 域名迁移：旧绝对地址改相对路径，随当前域名走
        if (typeof s.brand_avatar === "string") {
          s.brand_avatar = s.brand_avatar.replace(/^https?:\/\/moments\.237333536\.workers\.dev/, "");
        }
        var av = document.querySelector(".brand-avatar");
        if (av && /^https?:\/\//i.test(s.brand_avatar || "")) {
          var img = document.createElement("img");
          img.src = s.brand_avatar;
          img.alt = "";
          av.textContent = "";
          av.appendChild(img);
        }
        var bn = document.querySelector(".brand-name");
        if (bn && s.site_title) bn.textContent = s.site_title;
        var nf = document.querySelector('[data-route="feed"]');
        if (nf && s.nav_feeds_name) nf.textContent = s.nav_feeds_name;
        if (s.site_title) document.title = s.site_title;
      } catch (e) {}
    })();
  </script>
